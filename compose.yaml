services:
  app:
    image: ${TM_IMAGE:-teammanager:local}
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: ${TM_TRUSTED_PROXIES:-127.0.0.1}
      TM_DATABASE_URL: sqlite:////app/data/teammanager.db
      TM_COOKIE_SECURE: ${TM_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - teammanager_data:/app/data
      - teammanager_backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true

volumes:
  teammanager_data:
  teammanager_backups:
